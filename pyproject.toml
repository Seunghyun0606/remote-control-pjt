[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "remote-agent-control"
version = "0.7.1"
description = "Messenger-driven remote control plane for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiosqlite>=0.20,<1",
  "aiohttp>=3.10,<4",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-telegram-bot>=21.6,<23",
  "slack-bolt>=1.30,<2",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
remote-control = "remote_control.cli:app"
remote-runner = "remote_control.runner_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
