name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints/dev.txt -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints/dev.txt -e ".[dev]"
      - run: ruff check .
      - run: >-
          pytest -q
          tests/test_executables.py
          tests/test_codex_runner.py
          tests/test_settings.py
          tests/test_command_router.py
          tests/test_runner_gateway.py
          tests/test_project_sessions.py
          tests/test_runtime_hardening.py
          tests/test_p0_process_safety.py
          tests/test_p2_integrity.py
