name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/pip.txt
            constraints/build.txt
            constraints/lock.txt
      - name: Bootstrap hash-locked pip
        run: python -m pip install --require-hashes --only-binary=:all: -r constraints/pip.txt
      - name: Install hash-locked build toolchain
        run: python -m pip install --require-hashes --only-binary=:all: --no-deps -r constraints/build.txt
      - name: Install application without build isolation
        run: python -m pip install --no-build-isolation -c constraints/lock.txt -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: pytest -q

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/pip.txt
            constraints/build.txt
            constraints/lock.txt
      - name: Bootstrap hash-locked pip
        run: python -m pip install --require-hashes --only-binary=:all: -r constraints/pip.txt
      - name: Install hash-locked build toolchain
        run: python -m pip install --require-hashes --only-binary=:all: --no-deps -r constraints/build.txt
      - name: Install application without build isolation
        run: python -m pip install --no-build-isolation -c constraints/lock.txt -e ".[dev]"
      - run: python -m pip check
      - run: ruff check .
      - run: pytest -q
